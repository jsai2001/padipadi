<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#7c3aed" />
    <title>PadiPadi · Learn spoken Tamil by playing</title>
    <!-- Installable app: manifest + icons; sw.js (registered in app.js) makes it work offline. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PadiPadi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Apply the saved theme before first paint (light by default). -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("padipadi-v1") || "{}");
        if (s.settings && s.settings.theme === "dark") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;600;700;800&family=Baloo+Tammudu+2:wght@500;600&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <header class="topbar">
      <a class="brand" href="#/" aria-label="PadiPadi home">
        <span class="brand-mark" aria-hidden="true">படி</span>
        <span class="brand-name">PadiPadi</span>
      </a>
      <div class="stats" aria-label="Your progress">
        <span class="pill" id="streak-pill" title="Day streak"><span aria-hidden="true">🔥</span> <b id="streak">0</b><span class="visually-hidden"> day streak</span></span>
        <span class="pill" id="xp-pill" title="XP"><span aria-hidden="true">⭐</span> <b id="xp">0</b><span class="visually-hidden"> XP</span></span>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch to dark mode">🌙</button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Main">
      <a href="#/" data-tab="learn"><span aria-hidden="true">📚</span><span>Learn</span></a>
      <a href="#/builder" data-tab="builder"><span aria-hidden="true">🧩</span><span>Builder</span></a>
      <a href="#/me" data-tab="me"><span aria-hidden="true">🏆</span><span>Me</span></a>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <canvas id="confetti" aria-hidden="true"></canvas>

    <script src="./data.js"></script>
    <script src="./js/lexicon.js"></script>
    <script src="./js/lexicon-te.js"></script>
    <script src="./js/builder.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
